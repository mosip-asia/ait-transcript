# ==============================================================================
# AIT Multi-Credential Verifiable Credential Platform
# Root Developer Compose Manifest
# ==============================================================================
# Runs Inji Certify with the compiled SPI JAR mounted as a plugin.
# Builds and runs Gateway, Adapter, and VDR services.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# To compile the plugin without host Java/Maven:
#   docker compose -f compose.build.yaml run --rm plugin-builder
# ==============================================================================
name: ait-issuer

services:
  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./deploy/config/certify_init.sql:/docker-entrypoint-initdb.d/01_certify_init.sql
      - ./deploy/config/certify_seed.sql:/docker-entrypoint-initdb.d/02_certify_seed.sql
      - issuer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-postgres}", "-d", "inji_certify"]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "6440:5432"
    networks:
      - network

  certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "ait-itserv-uat-vm:100.70.36.145"
      - "ait-itserv-dev-vm:100.70.236.72"
    ports:
      - "9090:8090"
    environment:
      - container_user=mosip
      - active_profile_env=default, installation
      - SPRING_CONFIG_NAME=certify
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - enable_certify_artifactory=false
      - download_hsm_client=false
      - mosip_certify_domain_url=${CERTIFY_PUBLIC_BASE_URL:-http://localhost:9091}
      - CERTIFY_DID=${CERTIFY_DID:-did:key:z6MkpPLACEHOLDERreplaceMeViaBootstrapDidRefreshScript1}
      - CERTIFY_RECORD_URL=${CERTIFY_RECORD_URL:-http://adapter:8000/student/{sub}/transcript}
      - MOSIP_CERTIFY_GATEWAY_ENABLED=${MOSIP_CERTIFY_GATEWAY_ENABLED:-true}
      - MOSIP_CERTIFY_GATEWAY_URL=${MOSIP_CERTIFY_GATEWAY_URL:-http://gateway:8000}
      - AUTH_SERVER_JWKS_URL=${AUTH_SERVER_JWKS_URL:-http://certify:8090/v1/certify/.well-known/jwks.json}
    env_file:
      - ./installations/ait/authorization-server.env
    volumes:
      - type: bind
        source: ./src/issuer/target/issuer-data-provider-plugin.jar
        target: /home/inji/additional_jars/issuer-data-provider-plugin.jar
        read_only: true
        bind:
          create_host_path: false
      - ./deploy/config/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./deploy/config/certify-installation.properties:/home/mosip/config/certify-installation.properties
      - ./deploy/data/CERTIFY_PKCS12:/home/inji/CERTIFY_PKCS12
      - ./deploy/config/vp_request_config.json:/home/mosip/config/vp_request_config.json
    networks:
      - network
    depends_on:
      database:
        condition: service_healthy

  certify-nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "9091:80"
    volumes:
      - ./deploy/config/certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/config/vp_request_config.json:/config/server/vp_request_config.json:ro
    networks:
      - network
    depends_on:
      - certify

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: ghcr.io/mosip-asia/ait-gateway:local
    restart: unless-stopped
    env_file:
      - ./installations/ait/gateway.env
    networks:
      - network

  adapter:
    build:
      context: .
      dockerfile: adapter/Dockerfile
    image: ghcr.io/mosip-asia/ait-adapter:local
    environment:
      - ADAPTER_CSV=/data/student_identity_data.csv
    volumes:
      - ./installations/ait/adapter:/data:ro
    networks:
      - network

  vdr:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "9098:80"
    volumes:
      - ./src/vc-lab/contexts:/usr/share/nginx/html/contexts:ro
    networks:
      - network

volumes:
  issuer-db:

networks:
  network:
    name: ${DOCKER_NETWORK:-ait_network}
