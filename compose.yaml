# ==============================================================================
# AIT Multi-Credential Verifiable Credential Platform
# Root Developer Compose Manifest
# ==============================================================================
# Builds all services from src/ and runs the full platform locally.
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
# ==============================================================================
name: ait-platform

services:
  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./deploy/config/certify_init.sql:/docker-entrypoint-initdb.d/certify_init.sql
      - ./installations/${INSTALLATION:?set INSTALLATION in .env}/certify_seed.sql:/docker-entrypoint-initdb.d/certify_seed.sql
      - issuer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-postgres}", "-d", "inji_certify"]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "6440:5432"
    networks:
      - network

  certify:
    build:
      context: ./src/issuer
      dockerfile: Dockerfile
    image: ghcr.io/mosip-asia/ait-certify:local
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:8090"
    environment:
      - container_user=mosip
      - active_profile_env=default, installation
      - SPRING_CONFIG_NAME=certify
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - enable_certify_artifactory=false
      - download_hsm_client=false
      - mosip_certify_domain_url=${CERTIFY_PUBLIC_BASE_URL:-http://localhost:9091}
      - CERTIFY_DID=${CERTIFY_DID:-did:key:z6MkpPLACEHOLDERreplaceMeViaBootstrapDidRefreshScript1}
      - CERTIFY_RECORD_URL=${CERTIFY_RECORD_URL:-http://adapter:8000/student/{sub}/transcript}
      - MOSIP_CERTIFY_GATEWAY_ENABLED=${MOSIP_CERTIFY_GATEWAY_ENABLED:-true}
      - MOSIP_CERTIFY_GATEWAY_URL=${MOSIP_CERTIFY_GATEWAY_URL:-http://gateway:8000}
    env_file:
      - ./installations/${INSTALLATION}/authorization-server.env
    volumes:
      - ./deploy/config/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./installations/${INSTALLATION}/certify-installation.properties:/home/mosip/config/certify-installation.properties
      - ./deploy/data/CERTIFY_PKCS12:/home/inji/CERTIFY_PKCS12
      - ./deploy/config/vp_request_config.json:/home/mosip/config/vp_request_config.json
    networks:
      - network
    depends_on:
      database:
        condition: service_healthy

  certify-nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "9091:80"
    volumes:
      - ./deploy/config/certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/config/vp_request_config.json:/config/server/vp_request_config.json:ro
    networks:
      - network
    depends_on:
      - certify

  gateway:
    build:
      context: ./src/gateway
      dockerfile: Dockerfile
    image: ghcr.io/mosip-asia/ait-gateway:local
    restart: unless-stopped
    env_file:
      - ./installations/${INSTALLATION}/gateway.env
    networks:
      - network

  adapter:
    build:
      context: .
      dockerfile: adapter/Dockerfile
    image: ghcr.io/mosip-asia/ait-adapter:local
    environment:
      - ADAPTER_CSV=/data/student_identity_data.csv
    volumes:
      - ./installations/${INSTALLATION}/adapter:/data:ro
    networks:
      - network

  vdr:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./src/vc-lab/contexts:/usr/share/nginx/html/contexts:ro
    networks:
      - network

volumes:
  issuer-db:

networks:
  network:
    name: ${DOCKER_NETWORK:-ait_network}
