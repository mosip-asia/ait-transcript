# ==============================================================================
# AIT Verifiable Credential Issuer Platform
# Root Compose Manifest
# ==============================================================================
# Runs Inji Certify with the compiled SPI JAR mounted as a plugin,
# backed by PostgreSQL database, Certify Nginx ingress, and VDR context server.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# To compile the plugin without host Java/Maven:
#   docker compose -f compose.build.yaml run --rm plugin-builder
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}

services:
  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/base/certify_init.sql:/docker-entrypoint-initdb.d/01_certify_init.sql
      - issuer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "inji_certify"]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "${POSTGRES_PORT}:5432"

  certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:8090"
    environment:
      - active_profile_env=default, installation
      - AUTH_SERVER_ISSUER=${AUTH_SERVER_ISSUER}
      - AUTH_SERVER_JWKS_URL=${AUTH_SERVER_JWKS_URL}
      - AUTH_SERVER_WALLET_CLIENT_ID=${AUTH_SERVER_WALLET_CLIENT_ID}
      - CERTIFY_DID=${CERTIFY_DID}
      - CERTIFY_RECORD_URL=${CERTIFY_RECORD_URL}
      - container_user=mosip
      - download_hsm_client=false
      - enable_certify_artifactory=false
      - MOSIP_CERTIFY_GATEWAY_ENABLED=${MOSIP_CERTIFY_GATEWAY_ENABLED}
      - MOSIP_CERTIFY_GATEWAY_URL=${MOSIP_CERTIFY_GATEWAY_URL}
      - mosip_certify_domain_url=${CERTIFY_PUBLIC_BASE_URL}
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - SPRING_CONFIG_NAME=certify
    volumes:
      - type: bind
        source: ./src/issuer/target/issuer-data-provider-plugin.jar
        target: /home/inji/additional_jars/issuer-data-provider-plugin.jar
        read_only: true
        bind:
          create_host_path: false
      - ./deploy/base/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./deploy/${INSTALLATION}/certify-installation.properties:/home/mosip/config/certify-installation.properties
      - ./deploy/data/CERTIFY_PKCS12:/home/inji/CERTIFY_PKCS12
      - ./deploy/base/vp_request_config.json:/home/mosip/config/vp_request_config.json
    depends_on:
      database:
        condition: service_healthy
      template-sync:
        condition: service_completed_successfully

  certify-nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "9091:80"
    volumes:
      - ./deploy/base/certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/base/vp_request_config.json:/config/server/vp_request_config.json:ro
    depends_on:
      - certify

  vdr:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "9098:80"
    volumes:
      - ./src/vc-lab/contexts:/usr/share/nginx/html/contexts:ro

  template-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.template-sync
    image: ghcr.io/mosip-asia/certify-template-sync:local
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./config/credentials:/app/config/credentials:ro
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

volumes:
  issuer-db:
