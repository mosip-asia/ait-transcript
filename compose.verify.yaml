# ==============================================================================
# Verifier Service Compose Manifest
# ==============================================================================
# Runs the custom AIT-branded Inji Verify UI on port 4007,
# backed by upstream Inji Verify Service and PostgreSQL.
#
# Usage:
#   docker compose -f compose.yaml -f compose.verify.yaml up -d
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}

services:
  verify-ui:
    build:
      context: .
      dockerfile: src/verifier/Dockerfile
    image: ghcr.io/mosip-asia/verify-ui:local
    ports:
      - "4007:8000"
    environment:
      - DEFAULT_TITLE=${VERIFIER_TITLE:-AIT Credential Verifier}
      - DEFAULT_THEME=ait_theme
      - DEFAULT_LANG=en
      - INTERNET_CONNECTIVITY_CHECK_ENDPOINT=https://dns.google/
      - INTERNET_CONNECTIVITY_CHECK_TIMEOUT=10000
      - OVP_QR_HEADER=INJI_OVP://payload=
      - VERIFIABLE_CLAIMS_CONFIG_URL=/assets/config.json
      - VP_SUBMISSION_SUPPORTED=false
      - CLIENT_ID=inji-verify-ui
      - CLIENT_ID_DID=${INJI_VERIFY_DID_URI:-did:web:localhost%3A9095:v1:verify}
      - DISPLAY_TIMEOUT=120000
      - VERIFY_SERVICE_API_URL=/v1/verify
    volumes:
      - ./deploy/base/verify-config.json:/usr/share/nginx/html/assets/config.json:ro
    depends_on:
      - verify-service

  verify-service:
    image: injistack/inji-verify-service:0.17.0
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9095:8080"
    environment:
      - active_profile_env=default
      - DATABASE_HOST=verify-database
      - DATABASE_PORT=5432
      - DATABASE_NAME=inji_verify
      - DATABASE_SCHEMA=verify
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - INJI_VP_REQUEST_LONG_POLLING_TIMEOUT=55000
      - INJI_VP_SUBMISSION_BASE_URL=${INJI_VERIFY_PUBLIC_BASE_URL:-http://localhost:9095}/v1/verify
      - INJI_DID_VERIFY_URI=${INJI_VERIFY_DID_URI:-did:web:localhost%3A9095:v1:verify}
      - INJI_DID_VERIFY_PUBLIC_KEY_URI=${INJI_VERIFY_DID_PUBLIC_KEY_URI:-did:web:localhost%3A9095:v1:verify#key-0}
      - INJI_KEYSTORE_FILE_PASS=mosip
      - INJI_VERIFY_REDIRECT_URI=${INJI_VERIFY_REDIRECT_URI:-http://localhost:4007}
      - INJI_VERIFY_CLAIMS_WITH_META_DATA=_sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
    depends_on:
      verify-database:
        condition: service_healthy

  verify-database:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./deploy/base/verify_init.sql:/docker-entrypoint-initdb.d/verify_init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "inji_verify"]
      interval: 2s
      timeout: 3s
      retries: 60
