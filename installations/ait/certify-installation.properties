## ------------------------------------------- Mock ID Integration properties ------------------------------------------------------------
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MockVCIssuancePlugin

## ------------------------------------------- Mock ID plugin related properties ------------------------------------------------------------
mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
mosip.certify.mock.authenticator.get-identity-url=http://mock-identity-system:8082/v1/mock-identity-system/identity
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
mosip.certify.identifier=${mosip.certify.domain.url}

## ------------------------------------------- Authorization server: the installation's settings ------------------------------------------
# The values come from authorization-server.env (Compose's env_file), each set per environment in vc-stack/.env; tokens carry
# iss=${AUTH_SERVER_ISSUER}, which the issuer URI must equal. A token's aud must hold the wallet client or a credential endpoint.
mosip.certify.authorization.url=${AUTH_SERVER_ISSUER}
mosip.certify.authn.issuer-uri=${AUTH_SERVER_ISSUER}
mosip.certify.authn.jwk-set-uri=${AUTH_SERVER_JWKS_URL}
mosip.certify.authn.allowed-audiences={ '${AUTH_SERVER_WALLET_CLIENT_ID}', 'http://certify-nginx:80/v1/certify/issuance/credential', 'http://certify-nginx/v1/certify/issuance/credential', '${mosip.certify.domain.url}/v1/certify/issuance/credential' }

# Local sandbox uses did:key so verify-service can resolve issuer without an external HTTPS did:web host.
# The live keystore's did:key: bootstrap.sh's did_refresh writes CERTIFY_DID to vc-stack/.env (issuer/compose.yaml).
mosip.certify.data-provider-plugin.did-url=${CERTIFY_DID}

mosip.certify.plugin-mode=DataProvider
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://ait.example/credential/
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

## ------------------------------------------- The Data-provider plugin -------------------------------------------------------------------
# The jar comes from plugin/ (vc-stack/plugins/, mounted into additional_jars/). These ten keys are its whole configuration:
# it reads the record from the Adapter, after the Gateway passed it when the gate is on. A run without the Gateway sets
# MOSIP_CERTIFY_GATEWAY_ENABLED=false and MOSIP_CERTIFY_GATEWAY_URL=NO GATEWAY in Certify's environment (the no-Gateway
# stack forms do, or vc-stack/.env), which wins over this file; the token and the timeouts are then not read.
mosip.certify.integration.data-provider-plugin=IssuerDataProviderPlugin
mosip.certify.integration.scan-base-package=asia.mosip.issuer.plugin
# The Adapter: the mock Adapter unless the environment sets CERTIFY_ADAPTER_URL (vc-stack/.env; on the VM, app.env).
mosip.certify.adapter.url=${CERTIFY_ADAPTER_URL:http://adapter:8000}
mosip.certify.adapter.connect-timeout-ms=2000
mosip.certify.adapter.read-timeout-ms=10000
# The Approval gate, required: true or false.
mosip.certify.gateway.enabled=true
# With mosip.certify.gateway.enabled=false, write NO GATEWAY here. (A properties file has no end-of-line comment.)
mosip.certify.gateway.url=http://gateway:8000
# TEST-ONLY development value; must equal GATEWAY_AUTH_TOKEN in gateway.env.
mosip.certify.gateway.auth-token=dev-only-ait-gateway-token
mosip.certify.gateway.connect-timeout-ms=2000
mosip.certify.gateway.read-timeout-ms=15000
mosip.certify.data-provider-plugin.rendering-template-id=
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'AIT University Registrar',\
    'locale': 'en'\
  }\
}
mosip.certify.indexed-mappings.registrationNo=$.registrationNo
mosip.certify.indexed-mappings.fullName=$.fullName
mosip.certify.indexed-mappings.academicProgram=$.academicProgram
# The plugin's trace keys: who asked (the token's sub) and through which client, on every ledger row.
mosip.certify.indexed-mappings.tokenSub=$.tokenSub
mosip.certify.indexed-mappings.tokenClientId=$.tokenClientId
