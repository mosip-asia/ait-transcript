## ------------------------------------------- Mock ID Integration properties ------------------------------------------------------------
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MockVCIssuancePlugin

## ------------------------------------------- Mock ID plugin related properties ------------------------------------------------------------
mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
mosip.certify.mock.authenticator.get-identity-url=http://mock-identity-system:8082/v1/mock-identity-system/identity
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
mosip.certify.identifier=${mosip.certify.domain.url}

# Local sandbox uses did:key so verify-service can resolve issuer without an external HTTPS did:web host.
# Placeholder — bootstrap.sh's did_refresh overwrites with the live keystore's did:key.
mosip.certify.data-provider-plugin.did-url=did:key:z6Mknw7v43wXnN1fTS2ruxRMkbeENYfSgqTeZdW8TD1KaBef

mosip.certify.plugin-mode=DataProvider
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://ait.example/credential/
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

## ------------------------------------------- Gateway data-provider plugin (contracts.md section 2a) -------------------------------------
# The jar comes from gateway/plugin/ (vc-stack/plugins/, mounted into additional_jars/). These six keys are its whole configuration.
mosip.certify.integration.data-provider-plugin=GatewayDataProviderPlugin
mosip.certify.integration.scan-base-package=asia.mosip.issuer.gateway.plugin
mosip.certify.gateway.url=http://gateway:8000
# TEST-ONLY development value; must equal GATEWAY_AUTH_TOKEN in gateway.env.
mosip.certify.gateway.auth-token=dev-only-ait-gateway-token
mosip.certify.gateway.connect-timeout-ms=2000
mosip.certify.gateway.read-timeout-ms=15000
mosip.certify.data-provider-plugin.rendering-template-id=
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'AIT University Registrar',\
    'locale': 'en'\
  }\
}
mosip.certify.indexed-mappings.registrationNo=$.registrationNo
mosip.certify.indexed-mappings.fullName=$.fullName
mosip.certify.indexed-mappings.academicProgram=$.academicProgram
