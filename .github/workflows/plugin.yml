# Builds the Certify data-provider plugin (gateway/plugin/), runs its unit tests, and keeps the jar as an artifact
# named after the commit. The jar is never committed; run-demo.sh builds its own copy for the stack.
name: Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: Plugin jar (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: gateway/plugin/pom.xml

      - run: mvn -B -f gateway/plugin/pom.xml package

      - uses: actions/upload-artifact@v5
        with:
          name: gateway-data-provider-plugin-${{ github.sha }}
          path: gateway/plugin/target/gateway-data-provider-plugin.jar
          if-no-files-found: error
