# Tests only: never publishes images and never deploys (deploy.yml does that, by hand).
name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r app/requirements.txt tzdata

      # The readiness test reads vc-stack/config/mimoto-issuers-config.json, which is git-ignored.
      - name: Render the issuer config
        run: python data/render_mimoto_issuers_config.py

      - name: Run test scripts
        run: |
          status=0
          for t in \
            vc-stack/test_inji_web_vc_readiness.py \
            app/test_auth.py \
            app/test_requests.py \
            data/test_ait_courses.py \
            data/test_generate_csv.py \
            data/test_render_mimoto_issuers_config.py
          do
            echo "::group::$t"
            python "$t" || { echo "::error::$t failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"

  stack-smoke:
    name: Stack smoke (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f vc-stack/docker-compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # run-demo.sh does `docker compose run demo-app` before bootstrap.sh creates this external network.
      - name: Create the Docker network
        run: docker network create vc_stack_network

      - name: Bring up the stack
        run: ./run-demo.sh

      # The demo-app container writes the Certify CSV as root; smoke.sh rewrites it as the runner user.
      - name: Give generated config back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" vc-stack/config

      - run: ./vc-stack/smoke.sh

      - run: python3 vc-stack/test_context_refresh.py

      - name: Collect stack logs
        if: failure()
        run: |
          mkdir -p stack-logs
          docker ps -a > stack-logs/docker-ps.txt 2>&1 || true
          $COMPOSE logs --no-color --timestamps > stack-logs/compose.log 2>&1 || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: stack-logs
          path: stack-logs/

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
