# Tests only: never publishes images and never deploys (deploy.yml does that, by hand).
# Most tests run locally (see CLAUDE.md); CI runs on merges, releases and by hand.
name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The deploy/ directory the host tests run against; stack-smoke runs every installation.
env:
  INSTALLATION: ait

jobs:
  host-tests:
    name: Host tests (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r src/portal/requirements.txt -r src/gateway/requirements.txt tzdata

      # The readiness test reads deploy/ait/mimoto-issuers-config.json, which is git-ignored.
      - name: Render the issuer config
        run: python src/tools/render_mimoto_issuers_config.py

      - name: Run test scripts
        run: |
          status=0
          for t in \
            tests/test_inji_web_vc_readiness.py \
            tests/test_installations.py \
            tests/test_authorization_server.py \
            tests/test_issue_and_verify.py \
            src/verifier/test_verifier.py \
            src/portal/test_auth.py \
            src/portal/test_requests.py \
            tests/test_courses.py \
            src/tools/test_generate_csv.py \
            src/tools/test_render_mimoto_issuers_config.py \
            tests/test_adapter.py \
            src/gateway/tests/test_credential_types.py \
            src/gateway/tests/test_evaluations.py
          do
            echo "::group::$t"
            if python "$t"; then r=PASS; else r=FAIL; status=1; fi
            echo "::endgroup::"
            echo "$r $t"
          done
          exit "$status"

  # One fresh runner per installation and switch setting: Certify's seed runs only on a fresh database, so nothing is
  # wiped between them.
  stack-smoke:
    name: Stack smoke (Docker Compose, ${{ matrix.installation }}, gate ${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        installation: [ait, hackathon]
        gate: ['on', 'off']
    env:
      COMPOSE: docker compose -f compose.yaml
      INSTALLATION: ${{ matrix.installation }}
      MOSIP_CERTIFY_GATEWAY_ENABLED: ${{ matrix.gate == 'on' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bring up the stack
        run: ./scripts/deploy.sh ${{ matrix.installation }}

      - run: ./scripts/smoke-test.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-credential-${{ matrix.installation }}-gate-${{ matrix.gate }}-${{ github.sha }}
          path: .demo-state/smoke-credential-*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

      # context_refresh.sql moves the ait-transcript row only. It runs its own Postgres, so one leg is enough.
      - if: matrix.installation == 'ait' && matrix.gate == 'on'
        run: python3 tests/test_context_refresh.py

      # The stack writes only git-ignored files; a run that changes a tracked one puts a machine's key, certificate or
      # DID into the next commit.
      - name: The run left every tracked file unchanged
        run: git status --porcelain && test -z "$(git status --porcelain)"

      - name: Collect stack logs
        if: failure()
        run: |
          mkdir -p stack-logs
          docker ps -a > stack-logs/docker-ps.txt 2>&1 || true
          $COMPOSE logs --no-color --timestamps > stack-logs/compose.log 2>&1 || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: stack-logs-${{ matrix.installation }}-gate-${{ matrix.gate }}
          path: stack-logs/

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
