# Tests only: never publishes images and never deploys (deploy.yml does that, by hand).
name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The installations/ directory every job runs against.
env:
  INSTALLATION: ait

jobs:
  host-tests:
    name: Host tests (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r portal/requirements.txt -r gateway/requirements.txt tzdata

      # The readiness test reads installations/ait/mimoto-issuers-config.json, which is git-ignored.
      - name: Render the issuer config
        run: python data/render_mimoto_issuers_config.py

      - name: Run test scripts
        run: |
          status=0
          for t in \
            vc-stack/test_inji_web_vc_readiness.py \
            vc-stack/test_installation_guard.py \
            vc-stack/test_issue_and_verify.py \
            portal/test_auth.py \
            portal/test_requests.py \
            data/test_ait_courses.py \
            data/test_generate_csv.py \
            data/test_render_mimoto_issuers_config.py \
            adapter/test_adapter.py \
            gateway/tests/test_credential_types.py \
            gateway/tests/test_issuances.py
          do
            echo "::group::$t"
            if python "$t"; then r=PASS; else r=FAIL; status=1; fi
            echo "::endgroup::"
            echo "$r $t"
          done
          exit "$status"

  stack-smoke:
    name: Stack smoke (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f vc-stack/docker-compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # run-demo.sh builds the plugin jar in a Maven container with its repository in vc-stack/plugins/.m2.
      - uses: actions/cache@v4
        with:
          path: vc-stack/plugins/.m2
          key: plugin-m2-${{ hashFiles('gateway/plugin/pom.xml') }}

      - name: Bring up the stack
        run: ./run-demo.sh

      - run: ./vc-stack/smoke.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-credential-${{ github.sha }}
          path: .demo-state/smoke-credential.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

      - run: python3 vc-stack/test_context_refresh.py

      - name: Collect stack logs
        if: failure()
        run: |
          mkdir -p stack-logs
          docker ps -a > stack-logs/docker-ps.txt 2>&1 || true
          $COMPOSE logs --no-color --timestamps > stack-logs/compose.log 2>&1 || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: stack-logs
          path: stack-logs/

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
