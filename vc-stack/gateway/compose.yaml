name: vc-stack

services:
  # The Gateway: POST /evaluations, the read-only Checklist evaluation the Data-provider plugin asks before it fetches
  # a record. Settings (enabled scopes, adapter URL, bearer token) come from the installation's gateway.env. Reached
  # as http://gateway:8000; no host port. Its startup touches nothing external, so it waits for no other service.
  gateway:
    container_name: gateway
    build:
      context: ../..
      dockerfile: src/gateway/Dockerfile
    env_file:
      - ../../deploy/${INSTALLATION:?set INSTALLATION in vc-stack/.env}/gateway.env
    restart: unless-stopped
    networks:
      - network

networks:
  network:
    name: vc_stack_network
    external: true
