server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Mimoto fetches RFC 8414 metadata at this exact path. Keycloak only
  # serves OIDC Discovery, which is a superset. Rewrite to the OIDC path
  # so a single Keycloak realm satisfies both clients.
  location ~ ^/realms/([^/]+)/\.well-known/oauth-authorization-server$ {
    set $keycloak_upstream keycloak-server:8080;
    rewrite ^/realms/([^/]+)/\.well-known/oauth-authorization-server$ /realms/$1/.well-known/openid-configuration break;
    proxy_pass http://$keycloak_upstream;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    sub_filter '"authorization_endpoint":"http://keycloak:8080' '"authorization_endpoint":"http://localhost:9080';
    sub_filter_once off;
    sub_filter_types application/json;
  }

  # Mimoto's internal well-known fetch (Host: keycloak:8080) needs
  # token_endpoint to stay keycloak:8080 for its JWT client-assertion aud —
  # keep this JSON-only and narrowly scoped to authorization_endpoint,
  # separate from the browser-facing HTML rewrite below.
  location ~ ^/realms/[^/]+/\.well-known/openid-configuration$ {
    set $keycloak_upstream keycloak-server:8080;
    proxy_pass http://$keycloak_upstream;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    sub_filter '"authorization_endpoint":"http://keycloak:8080' '"authorization_endpoint":"http://localhost:9080';
    sub_filter_once off;
    sub_filter_types application/json;
  }

  location / {
    set $keycloak_upstream keycloak-server:8080;
    proxy_pass http://$keycloak_upstream;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # --hostname-url=http://keycloak:8080 (needed so Mimoto's JWT aud
    # matches) makes Keycloak self-reference that internal Docker hostname
    # in every HTML page it serves, including the login form's `action`.
    # The browser can't resolve "keycloak", so rewrite it back to
    # localhost:9080 for HTML responses only (JSON well-known is handled
    # by the dedicated location above and must NOT get this broad rewrite,
    # or Mimoto's token_endpoint aud would break again).
    sub_filter 'http://keycloak:8080' 'http://localhost:9080';
    sub_filter_once off;
    sub_filter_types text/html;
  }
}
