log_format authdebug '$remote_addr - "$request" $status auth="$http_authorization"';
access_log /var/log/nginx/access.log authdebug;

# Defer upstream DNS to request time so nginx starts even when `certify` is not on Docker DNS yet
# (plain `docker compose restart` otherwise exits with "host not found in upstream certify").
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /config/server;
        autoindex on;
    }

    location /v1/certify/ {
        set $certify_upstream certify:8090;
        # No URI here (deliberately, not an oversight): with a variable-based
        # upstream, nginx skips its usual location-prefix-for-proxy_pass-URI
        # substitution and only forwards the literal proxy_pass URI, dropping
        # everything after it (e.g. "/v1/certify/issuance/credential" became
        # just "/v1/certify/" upstream, a 404 "No static resource" from
        # Certify's DispatcherServlet on a JWT-authenticated request while
        # unauthenticated requests still got Certify's normal 403 — same
        # dropped suffix, different response because Spring Security only
        # reaches static-resource fallback once auth passes). Since this
        # location's prefix and Certify's path are identical, forwarding the
        # request URI unchanged (no URI on proxy_pass) is the correct fix.
        proxy_pass http://$certify_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /.well-known/did.json {
        set $certify_upstream certify:8090;
        proxy_pass http://$certify_upstream/v1/certify/.well-known/did.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /.well-known/openid-credential-issuer {
        set $certify_upstream certify:8090;
        proxy_pass http://$certify_upstream/v1/certify/.well-known/openid-credential-issuer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
