name: vc-stack

services:
  # Mimoto's own Postgres; no host port.
  demo-database:
    image: 'postgres:15'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ../mimoto_init.sql:/docker-entrypoint-initdb.d/mimoto_init.sql
    networks:
      - network

  mimoto-service:
    container_name: 'mimoto-service'
    image: injistack/mimoto:0.21.0
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '9099:8099'
    environment:
      - container_user=mosip
      - active_profile_env=default
      - SPRING_CONFIG_NAME=mimoto
      - SPRING_CONFIG_LOCATION=/home/mosip/
      - SPRING_CLOUD_BOOTSTRAP_LOCATION=/home/mosip/mimoto-bootstrap.properties
      - oidc_p12_password=xy4gh6swa2i
      - WALLET_BINDING_PARTNER_API_KEY=dummywalletbindingpartnerapikey
      - SPRING_DATASOURCE_URL=jdbc:postgresql://demo-database:5432/inji_mimoto
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - GOOGLE_OAUTH_CLIENT_ID=clientId
      - GOOGLE_OAUTH_CLIENT_SECRET=clientSecret
      - SPRING_CLOUD_LOADBALANCER_ENABLED=false
      - SPRING_CLOUD_DISCOVERY_ENABLED=false
      # Override mimoto-default.properties' localhost defaults for public
      # deployment (Spring env vars take precedence over the properties
      # file) — same KEYCLOAK_PUBLIC_BASE_URL / INJI_WEB_URL used elsewhere
      # in the stack's compose files, so there's one source of truth per concept.
      - KEYCLOAK_EXTERNAL_URL=${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:9080}
      - MOSIP_INJI_WEB_URL=${INJI_WEB_URL:-http://localhost:4004}
      - MOSIP_SECURITY_ORIGINS=${INJI_WEB_URL:-http://localhost:4004}
    networks:
      - network
    volumes:
      - ../config/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ../config/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties
      # Compose refuses this file when INSTALLATION is unset, as it does issuer/ and mock-adapter/.
      - ../../installations/${INSTALLATION:?set INSTALLATION in vc-stack/.env}/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ../config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
      - ../certs/oidckeystore.p12:/home/mosip/certs/oidckeystore.p12
    # public-gateway's port 8080 is Mimoto's Spring config server (mimoto-bootstrap.properties), read at start.
    depends_on:
      - demo-database
      - certify-nginx
      - public-gateway
    restart: unless-stopped

  inji-web:
    container_name: 'inji-web'
    image: injistack/inji-web:0.16.0
    ports:
      - '4004:3004'
    environment:
      - DEFAULT_LANG=en
      - MIMOTO_URL=${INJI_WEB_URL:-http://localhost:4004}/v1/mimoto
    volumes:
      - ../config/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ../../installations/${INSTALLATION}/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ../config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
      - ../config/credential-template.html:/home/mosip/credential-template.html
      - ../config/AITUniversity-ait-transcript-template.html:/home/mosip/AITUniversity-ait-transcript-template.html
      - ../nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mimoto-service
    networks:
      - network

  keycloak-server:
    container_name: keycloak-server
    image: quay.io/keycloak/keycloak:24.0
    command:
      [
        "start-dev",
        "--import-realm",
        "--hostname-strict=true",
        "--hostname-url=${KEYCLOAK_DOCKER_AUTH_SERVER:-http://keycloak:8080}",
        "--hostname-port=9080",
        "--hostname-admin-url=${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:9080}",
        "--proxy=edge",
        "--proxy-headers=xforwarded",
      ]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ../../installations/${INSTALLATION}/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - network

  keycloak:
    container_name: keycloak
    image: nginx:stable
    ports:
      - "9080:8080"
    environment:
      - KEYCLOAK_PUBLIC_BASE_URL=${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:9080}
    volumes:
      # .template + /etc/nginx/templates/ so nginx's own docker-entrypoint
      # envsubst's $KEYCLOAK_PUBLIC_BASE_URL in on container start — no
      # custom entrypoint needed, this is the official nginx image's own
      # templating mechanism.
      - ../keycloak-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - keycloak-server
    restart: unless-stopped
    networks:
      - network

  public-gateway:
    container_name: public-gateway
    image: nginx:stable
    ports:
      - "9098:80"
    volumes:
      - ../public-gateway-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../config/public-gateway-mobile.conf:/etc/nginx/mobile/public-gateway-mobile.conf:ro
      - ../config/mimoto-issuers-mobile.json:/etc/nginx/mobile/mimoto-issuers-mobile.json:ro
      # Mimoto's config server (the second server in public-gateway-nginx.conf).
      - ../config:/config/server:ro
      - ../../installations/${INSTALLATION}/mimoto-issuers-config.json:/config/installation/mimoto-issuers-config.json:ro
    # Every upstream resolves per request (resolver + set in public-gateway-nginx.conf), so it starts before
    # mimoto-service, which needs its config server, and without keycloak, which Mode A leaves down.
    depends_on:
      - certify-nginx
      - verify-service
      - vdr
    restart: unless-stopped
    networks:
      - network

  demo-app:
    container_name: demo-app
    build:
      context: ../..
      dockerfile: portal/Dockerfile
    ports:
      - "4100:4100"
    environment:
      # Persisted via bind mount below (see README.md).
      - AIT_DEMO_DB=/demo/.demo-state/demo_requests.db
      # Student-facing deep links (portal/requests.py) — same vars as the rest
      # of the stack's compose files, localhost by default for local dev.
      - INJI_WEB_URL=${INJI_WEB_URL:-http://localhost:4004}
      - INJI_VERIFY_URL=${INJI_VERIFY_URL:-http://localhost:4007}
      # Only data/render_mimoto_issuers_config.py reads this one (phone-only gateway files).
      - CERTIFY_PUBLIC_BASE_URL=${CERTIFY_PUBLIC_BASE_URL:-http://certify-nginx}
      # Which installations/ directory data/render_mimoto_issuers_config.py renders into.
      - INSTALLATION=${INSTALLATION}
    # The Authorization Server's settings: the sign-out link (portal/requests.py), the issuer-list render, and the
    # smoke's token request (vc-stack/issue_and_verify.py runs in this image).
    env_file:
      - ../../installations/${INSTALLATION}/authorization-server.env
    volumes:
      - ../../portal:/demo/portal
      - ../../data:/demo/data
      - ../../.demo-state:/demo/.demo-state
      - ../../vc-stack/config:/demo/vc-stack/config
      - ../../installations:/demo/installations
    networks:
      - network
    # Server-to-server calls to Certify's ledger-search/credentials/status (registrar VC lifecycle);
    # student-facing wallet/verify links are still browser-only deep links, built from
    # INJI_WEB_URL/INJI_VERIFY_URL and AUTH_SERVER_PUBLIC_URL above (see portal/requests.py).

networks:
  network:
    name: vc_stack_network
    external: true
