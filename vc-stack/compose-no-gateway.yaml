# The full stack without the Gateway: compose.yaml with gateway/ left out and Certify's plugin switch off
# (issuer/no-gateway.yaml), so every record the Adapter serves is issued to whoever may sign in. Every script runs it
# when COMPOSE_FILE names it (relative to vc-stack/):
#   COMPOSE_FILE=compose-no-gateway.yaml ./run-demo.sh
#   COMPOSE_FILE=compose-no-gateway.yaml ./vc-stack/smoke.sh
name: vc-stack

include:
  - path:
      - issuer/compose.yaml
      - issuer/no-gateway.yaml
  - verify/compose.yaml
  - mock-adapter/compose.yaml
  - demo/compose.yaml
