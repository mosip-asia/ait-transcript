# ==============================================================================
# Inji Certify Platform - Standalone Production / Staging Deployment
# ==============================================================================
# Runs pre-built release images from container registry (no source build).
# Usage:
#   cd deploy
#   cp .env.example .env
#   docker compose up -d
# ==============================================================================
name: ait-issuer-deploy

services:
  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./config/certify_init.sql:/docker-entrypoint-initdb.d/01_certify_init.sql
      - issuer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-postgres}", "-d", "inji_certify"]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - network

  template-sync:
    image: ${TEMPLATE_SYNC_IMAGE:-ghcr.io/mosip-asia/certify-template-sync:latest}
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../config/credentials:/app/config/credentials:ro
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    networks:
      - network

  certify:
    image: ${CERTIFY_IMAGE:-ghcr.io/mosip-asia/ait-certify:latest}
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:8090"
    environment:
      - active_profile_env=default, installation
      - AUTH_SERVER_ISSUER=${AUTH_SERVER_ISSUER}
      - AUTH_SERVER_JWKS_URL=${AUTH_SERVER_JWKS_URL}
      - AUTH_SERVER_WALLET_CLIENT_ID=${AUTH_SERVER_WALLET_CLIENT_ID:-wallet-demo}
      - CERTIFY_DID=${CERTIFY_DID:-did:key:z6MkpPLACEHOLDERreplaceMeViaBootstrapDidRefreshScript1}
      - CERTIFY_RECORD_URL=${CERTIFY_RECORD_URL:-http://adapter:8000/student/{sub}/transcript}
      - container_user=mosip
      - download_hsm_client=false
      - enable_certify_artifactory=false
      - MOSIP_CERTIFY_GATEWAY_ENABLED=${MOSIP_CERTIFY_GATEWAY_ENABLED:-true}
      - MOSIP_CERTIFY_GATEWAY_URL=${MOSIP_CERTIFY_GATEWAY_URL:-http://gateway:8000}
      - mosip_certify_domain_url=${CERTIFY_PUBLIC_BASE_URL:-http://localhost:9091}
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - SPRING_CONFIG_NAME=certify
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./config/certify-installation.properties:/home/mosip/config/certify-installation.properties
      - ./data/CERTIFY_PKCS12:/home/inji/CERTIFY_PKCS12
      - ./config/vp_request_config.json:/home/mosip/config/vp_request_config.json
    networks:
      - network
    depends_on:
      database:
        condition: service_healthy
      template-sync:
        condition: service_completed_successfully

  certify-nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "9091:80"
    volumes:
      - ./config/certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./config/vp_request_config.json:/config/server/vp_request_config.json:ro
    networks:
      - network
    depends_on:
      - certify

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/mosip-asia/ait-gateway:latest}
    restart: unless-stopped
    env_file:
      - ../installations/ait/gateway.env
    networks:
      - network

  vdr:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ../src/vc-lab/contexts:/usr/share/nginx/html/contexts:ro
    networks:
      - network

volumes:
  issuer-db:

networks:
  network:
    name: ${DOCKER_NETWORK:-issuer_network}
