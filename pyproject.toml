[project]
name = "ait-issuer-platform"
version = "0.1.0"
description = "AIT Verifiable Credential Platform: Inji Certify Issuer, Permission/Workflow Gate, and VC Lab Designer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1.0",
    "tzdata",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
certify-template-sync = "certify_template_sync.sync:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/adapter",
    "src/certify_template_sync",
    "src/gateway",
    "src/portal",
    "src/sis_bridge",
    "src/tools",
]
