# ==============================================================================
# Developer Override: Loop 3 - Hot JAR Mount Mode
# ==============================================================================
# Merged over compose.yaml when COMPOSE_FILE=compose.yaml:compose.dev.yaml
# Mounts the locally compiled JAR directly into Inji Certify (~3s dev loop).
# ==============================================================================
services:
  certify:
    volumes:
      - ./plugin/target/issuer-data-provider-plugin.jar:/home/inji/additional_jars/issuer-data-provider-plugin.jar:ro
